name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Cache Native Third-Party SDKs
        id: cache-native-deps
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/third_party
          key: native-deps-ncnn-20261020-opencv-4.10.0-eigen-3.4.0

      - name: Fetch Native Dependencies (if not cached)
        if: steps.cache-native-deps.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/fetch_native_deps.sh
          ./scripts/fetch_native_deps.sh

      - name: Fetch NCNN Model Weights
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/fetch_models.sh
          ./scripts/fetch_models.sh models-v1.0.0

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK (arm64-v8a)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShelfPulse-AI-arm64-v8a-apk
          path: app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
