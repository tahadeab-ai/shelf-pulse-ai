name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Native Third-Party SDKs
        id: cache-native-deps
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/third_party
          key: native-deps-ncnn-20261020-opencv-4.10.0-eigen-3.4.0

      - name: Fetch Native Dependencies (if not cached)
        if: steps.cache-native-deps.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/fetch_native_deps.sh
          ./scripts/fetch_native_deps.sh

      - name: Fetch NCNN Model Weights
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/fetch_models.sh
          ./scripts/fetch_models.sh models-v1.1.0

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_package
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_package/ShelfPulse-AI-arm64-v8a.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_package/ShelfPulse-AI-arm64-v8a.apk
          fi
          if [ -f app/src/main/assets/models/model.ncnn.param ]; then
            cp app/src/main/assets/models/model.ncnn.param release_package/
            cp app/src/main/assets/models/model.ncnn.bin release_package/
          fi
          cd release_package
          sha256sum * > SHA256SUMS.txt || true

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "ShelfPulse AI ${{ steps.vars.outputs.tag }}"
          body: |
            ## ShelfPulse AI ${{ steps.vars.outputs.tag }} Release
            - **Target:** Android (`arm64-v8a`)
            - **Vision Engine:** C++17 (YOLO11 NCNN FP16 + Vulkan GPU + ByteTrack-cpp)
            - **UI Framework:** Kotlin + Jetpack Compose + CameraX (100% Offline)
            - **Verification:** Tested on physical Android hardware via ADB

            ### Included Artifacts
            - `ShelfPulse-AI-arm64-v8a.apk`
            - `model.ncnn.param` & `model.ncnn.bin`
            - `SHA256SUMS.txt`
          files: release_package/*
