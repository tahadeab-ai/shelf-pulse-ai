<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="120">
  <defs>
    <linearGradient id="grad-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="120" rx="16" fill="url(#grad-bg)" />

  <!-- Geometric Scanner & Pulse Icon -->
  <g transform="translate(24, 20)">
    <!-- Corner brackets -->
    <path d="M10,25 L10,10 L25,10" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M55,10 L70,10 L70,25" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M70,55 L70,70 L55,70" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M25,70 L10,70 L10,55" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Pulse Line -->
    <path d="M6,40 L22,40 L28,24 L36,56 L44,32 L50,40 L74,40" stroke="url(#grad-pulse)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="40" cy="18" r="3" fill="#38BDF8" />
  </g>

  <!-- Typography -->
  <text x="124" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
    Shelf<tspan fill="#10B981">Pulse</tspan> <tspan fill="#06B6D4" font-size="28" font-weight="600">AI</tspan>
  </text>
  <text x="126" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
    Offline Edge-AI Retail Inventory Counter • YOLO11n • NCNN Vulkan C++17
  </text>
</svg>
